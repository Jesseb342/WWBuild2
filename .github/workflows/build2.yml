# .github/workflows/inspect-repos.yml
#
# Milestone 2b: gather facts for the Conker iOS port. Clones the two PUBLIC
# repos on a cheap Linux runner and writes one text report: layouts, patch
# footprints, pinned submodule versions, and host build files. No ROM needed.
#
# Run it, download the "inspection-report" artifact, unzip, and upload
# inspection.txt to Claude.

name: Inspect BananaPad and CBFD

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clone BananaPad and CBFD-Recompiled
        run: |
          git clone --depth 1 https://github.com/chrissotraidis/bananapad bp
          git clone --depth 1 --recursive --shallow-submodules \
              https://github.com/sciaschi/CBFD-Recompiled.git cbfd

      - name: Build report
        run: |
          R="$PWD/inspection.txt"
          sec() { printf '\n\n===== %s =====\n' "$1" >> "$R"; }

          sec "BananaPad commit"
          (cd bp && git log -1 --format='%H %cd') >> "$R" 2>&1 || true

          sec "BananaPad tree (depth 3)"
          (cd bp && find . -maxdepth 3 -not -path './.git*' | sort | head -500) >> "$R" 2>&1 || true

          sec "BananaPad patches: files touched"
          (cd bp && ls -la patches 2>/dev/null; \
           grep -h '^+++ ' patches/*.patch patches/*/*.patch 2>/dev/null | sort | uniq -c | sort -rn | head -150) >> "$R" 2>&1 || true

          sec "BananaPad pins and config (padforge/padmint/json)"
          (cd bp && ls *.json 2>/dev/null; for f in *.json; do echo "--- $f"; head -120 "$f"; done) >> "$R" 2>&1 || true

          sec "BananaPad bootstrap script (first 220 lines)"
          (cd bp && head -220 scripts/bootstrap-bananapad.sh) >> "$R" 2>&1 || true

          sec "BananaPad iOS device build script"
          (cd bp && cat scripts/build-bananapad-ios-device.sh | head -220) >> "$R" 2>&1 || true

          sec "BananaPad scripts and docs listing"
          (cd bp && ls -la scripts docs apple 2>/dev/null) >> "$R" 2>&1 || true

          sec "BananaPad: references to upstream/RT64/runtime pins"
          (cd bp && grep -rniE 'upstream|rt64|N64ModernRuntime|N64Recomp|commit' scripts/*.sh 2>/dev/null | head -120) >> "$R" 2>&1 || true

          sec "CBFD commit and submodules"
          (cd cbfd && git log -1 --format='%H %cd'; cat .gitmodules; git submodule status) >> "$R" 2>&1 || true

          sec "CBFD tree (depth 2)"
          (cd cbfd && find . -maxdepth 2 -not -path './.git*' -not -path './tools/*/*' -not -path './conker/*' | sort | head -300) >> "$R" 2>&1 || true

          sec "CBFD recomp/ patches: size and files touched"
          (cd cbfd && wc -l recomp/*.patch; \
           grep -h '^+++ ' recomp/*.patch | sort -u | head -150) >> "$R" 2>&1 || true

          sec "CBFD host/ tree"
          (cd cbfd && find host -maxdepth 3 -type f | sort | head -300) >> "$R" 2>&1 || true

          sec "CBFD host/CMakeLists.txt (first 250 lines)"
          (cd cbfd && head -250 host/CMakeLists.txt) >> "$R" 2>&1 || true

          sec "CBFD build.sh (if present)"
          (cd cbfd && cat build.sh 2>/dev/null | head -200) >> "$R" 2>&1 || true

          wc -c "$R"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: inspection-report
          path: inspection.txt
          retention-days: 3

