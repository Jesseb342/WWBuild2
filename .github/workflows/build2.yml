# .github/workflows/inspect-glue.yml
#
# Milestone 2d: dump the "glue" between a native iOS shell and the game host,
# on both sides, so the Conker shell can be written against real code.
# Public repos only, no ROM, cheap Linux runner. Download the "glue-report"
# artifact and upload glue.txt to Claude.

name: Inspect host glue

on:
  workflow_dispatch:

jobs:
  glue:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install patchutils
        run: sudo apt-get update && sudo apt-get install -y patchutils

      - name: Clone both projects
        run: |
          git clone --depth 1 https://github.com/chrissotraidis/bananapad bp
          git clone --depth 1 --recursive --shallow-submodules \
              https://github.com/sciaschi/CBFD-Recompiled.git cbfd

      - name: Build report
        run: |
          R="$PWD/glue.txt"
          P="$PWD/bp/patches/bananapad/bananapad-integration.patch"
          sec() { printf '\n\n===== %s =====\n' "$1" >> "$R"; }

          sec "BananaPad integration patch: host glue (everything except lib/ and .github/)"
          filterdiff -p1 -x 'lib/*' -x '.github/*' "$P" | head -900 >> "$R" 2>&1 || true

          sec "BananaPad apple/core/bananapad_native.h"
          cat bp/apple/core/bananapad_native.h >> "$R" 2>&1 || true

          sec "BananaPad apple/core/bananapad_native.cpp (first 300 lines)"
          head -300 bp/apple/core/bananapad_native.cpp >> "$R" 2>&1 || true

          sec "BananaPad apple/core/bananapad_rt64_context.h"
          cat bp/apple/core/bananapad_rt64_context.h >> "$R" 2>&1 || true

          sec "BananaPad apple/core/paperpad_paths.h and paperpad_input.h"
          cat bp/apple/core/paperpad_paths.h bp/apple/core/paperpad_input.h >> "$R" 2>&1 || true

          sec "BananaPad apple/app/recompui_stub.cpp"
          head -300 bp/apple/app/recompui_stub.cpp >> "$R" 2>&1 || true

          sec "BananaPad apple/app/ios_main.mm (first 200 lines)"
          head -200 bp/apple/app/ios_main.mm >> "$R" 2>&1 || true

          sec "CBFD host/src/conker.hpp"
          cat cbfd/host/src/conker.hpp >> "$R" 2>&1 || true

          sec "CBFD host/src/main.cpp (full)"
          cat cbfd/host/src/main.cpp >> "$R" 2>&1 || true

          sec "CBFD recompui:: / recompinput:: API usage across host/src (count, symbol)"
          (cd cbfd/host/src && grep -ohE '(recompui|recompinput)::[A-Za-z_0-9:]+' *.cpp *.hpp | sort | uniq -c | sort -rn | head -150) >> "$R" 2>&1 || true

          sec "CBFD host/src/frontend.cpp (first 160 lines)"
          head -160 cbfd/host/src/frontend.cpp >> "$R" 2>&1 || true

          sec "CBFD host/src/audio_output.cpp (full)"
          cat cbfd/host/src/audio_output.cpp >> "$R" 2>&1 || true

          sec "CBFD functions defined in host/src that conker.toml hooks may call"
          (cd cbfd && grep -oE 'func *= *"[A-Za-z_0-9]+"|hook *= *"[A-Za-z_0-9]+"|before_vram|"conker_[A-Za-z_0-9]+"' conker.toml | sort | uniq -c | sort -rn | head -80) >> "$R" 2>&1 || true

          wc -c "$R"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: glue-report
          path: glue.txt
          retention-days: 3
