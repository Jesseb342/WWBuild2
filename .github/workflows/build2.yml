# .github/workflows/check-ios-patch-compat.yml
#
# Milestone 2c: will BananaPad's iOS changes to RT64 and N64ModernRuntime
# still apply on top of the versions (and Conker patches) used by
# sciaschi/CBFD-Recompiled? This only dry-runs patches; nothing is built and
# no ROM is needed. Download the "compat-report" artifact and upload
# compat.txt to Claude.

name: Check iOS patch compatibility

on:
  workflow_dispatch:

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install patchutils
        run: sudo apt-get update && sudo apt-get install -y patchutils

      - name: Clone both projects
        run: |
          git clone --depth 1 https://github.com/chrissotraidis/bananapad bp
          git clone --depth 1 --recursive --shallow-submodules \
              https://github.com/sciaschi/CBFD-Recompiled.git cbfd

      - name: Apply CBFD's own patches first (same as its build.sh)
        working-directory: cbfd
        run: |
          git -C tools/N64Recomp apply ../../recomp/n64recomp.patch
          git -C tools/N64ModernRuntime apply ../../recomp/n64modernruntime.patch
          git -C tools/rt64 apply ../../recomp/rt64.patch

      - name: Dry-run BananaPad's iOS hunks on top
        run: |
          R="$PWD/compat.txt"
          P="$PWD/bp/patches/bananapad/bananapad-integration.patch"
          sec() { printf '\n\n===== %s =====\n' "$1" >> "$R"; }

          sec "Versions"
          echo "BananaPad pins: rt64 cc6d137, N64ModernRuntime 45bd018" >> "$R"
          (cd cbfd && git submodule status tools/rt64 tools/N64ModernRuntime) >> "$R" 2>&1

          # RT64 hunks (paths look like a/lib/rt64/... so strip 3 components)
          filterdiff -p1 -i 'lib/rt64/*' "$P" > rt64-ios.patch || true
          sec "RT64: files in BananaPad's iOS patch"
          grep '^+++ ' rt64-ios.patch >> "$R" || true
          sec "RT64: dry-run on CBFD's patched tools/rt64"
          patch --dry-run -p3 -f -d cbfd/tools/rt64 -i "$PWD/rt64-ios.patch" >> "$R" 2>&1 || true

          # N64ModernRuntime hunks (a/lib/N64ModernRuntime/... -> strip 4)
          filterdiff -p1 -i 'lib/N64ModernRuntime/*' "$P" > runtime-ios.patch || true
          sec "N64ModernRuntime: files in BananaPad's iOS patch"
          grep '^+++ ' runtime-ios.patch >> "$R" || true
          sec "N64ModernRuntime: dry-run on CBFD's patched tools/N64ModernRuntime"
          patch --dry-run -p4 -f -d cbfd/tools/N64ModernRuntime -i "$PWD/runtime-ios.patch" >> "$R" 2>&1 || true

          # How far has upstream moved between the two pins?
          sec "RT64 drift: BananaPad pin -> CBFD pin (stat of Apple/Metal files)"
          (
            cd cbfd/tools/rt64
            git fetch --quiet --depth=1 origin cc6d137a3cca95faa018f24ebb5ca765dbfa7cf2
            git diff --shortstat cc6d137a3cca95faa018f24ebb5ca765dbfa7cf2 4337374 -- . ':!src/contrib'
            git diff --stat cc6d137a3cca95faa018f24ebb5ca765dbfa7cf2 4337374 -- \
              src/apple src/contrib/plume src/render/rt64_render_target.cpp \
              src/render/rt64_shader_library.cpp src/shaders/TextureSampler.hlsli | tail -40
          ) >> "$R" 2>&1 || true

          sec "N64ModernRuntime drift: BananaPad pin -> CBFD pin"
          (
            cd cbfd/tools/N64ModernRuntime
            git fetch --quiet --depth=1 origin 45bd0180f85c89c19ae45d30190be54c9d577904
            git diff --shortstat 45bd0180f85c89c19ae45d30190be54c9d577904 cdf5abbd5026fef5c364c676e4667c45e42b6863
            git diff --stat 45bd0180f85c89c19ae45d30190be54c9d577904 cdf5abbd5026fef5c364c676e4667c45e42b6863 -- \
              ultramodern/src/events.cpp ultramodern/include/ultramodern/config.hpp \
              librecomp/src/recomp.cpp librecomp/src/mods.cpp librecomp/include/librecomp/mods.hpp \
              librecomp/CMakeLists.txt | tail -40
          ) >> "$R" 2>&1 || true

          sec "CBFD: dynamic-code / LiveRecomp usage (matters for iOS no-JIT)"
          (cd cbfd && grep -rniE 'live_recompiler|LiveRecomp|sljit|mprotect|PROT_EXEC|MAP_JIT|maxprot' \
              host/src host/CMakeLists.txt host/macos recomp/n64modernruntime.patch 2>/dev/null | head -60) >> "$R" 2>&1 || true

          sec "CBFD: where the host depends on recompui (launcher/menus)"
          (cd cbfd && grep -rlE 'recompui|RmlUi|recompinput' host/src | sort) >> "$R" 2>&1 || true
          (cd cbfd && wc -l host/src/*.cpp | sort -rn | head -30) >> "$R" 2>&1 || true

          wc -c "$R"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: compat-report
          path: compat.txt
          retention-days: 3
