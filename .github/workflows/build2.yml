# .github/workflows/build-conker-recomp-macos.yml
#
# Milestone 2a: prove the existing community Conker recomp
# (sciaschi/CBFD-Recompiled) builds on a GitHub macOS runner from your own
# US ROM. This is a DESKTOP macOS build, not the iOS app: it just shows the
# decomp -> N64Recomp -> RT64/Metal chain works in CI before we port it to the
# BananaPad iOS shell.
#
# UNTESTED. Written from the project's README; expect to tweak.
#
# Setup:
#   -> upload your Conker US ROM to Google Drive (Anyone with the link)
#      Required SHA-1: 4cbadd3c4e0729dec46af64ad018050eada4f47a
#   -> the file ID is already filled in below
#   -> keep this repo PRIVATE

name: Build Conker recomp (macOS test)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Select newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install build tools
        run: |
          brew update
          brew install cmake ninja pkg-config sdl2 freetype jq python@3.11 ripgrep

      - name: Download ROM from Google Drive
        env:
          ROM_DRIVE_ID: 1ZgP1dSW_YGs5EGy-55a0JI-I3-BPw0qR
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet gdown
          "$RUNNER_TEMP/venv/bin/gdown" \
              "https://drive.google.com/uc?id=$ROM_DRIVE_ID" \
              -O "$RUNNER_TEMP/conker.z64"
          ls -l "$RUNNER_TEMP/conker.z64"
          SHA=$(shasum -a 1 "$RUNNER_TEMP/conker.z64" | cut -d' ' -f1)
          echo "ROM SHA-1: $SHA"
          test "$SHA" = "4cbadd3c4e0729dec46af64ad018050eada4f47a"

      - name: Clone CBFD-Recompiled (with submodules)
        run: |
          git clone --recursive https://github.com/sciaschi/CBFD-Recompiled.git cbfd
          cd cbfd && git log -1 --format='%H %cd'

      - name: Build (decomp -> N64Recomp -> host app)
        working-directory: cbfd
        run: ./build.sh "$RUNNER_TEMP/conker.z64"

      - name: Show build output
        if: always()
        working-directory: cbfd
        run: |
          ls -la host/build || true
          find . -path ./conker -prune -o -name 'ConkerRecomp*' -print | head

      - name: Remove ROM
        if: always()
        run: rm -f "$RUNNER_TEMP/conker.z64"

